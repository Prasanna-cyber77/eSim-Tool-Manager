<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b16"/>
      <stop offset="50%" stop-color="#0c1933"/>
      <stop offset="100%" stop-color="#070e1c"/>
    </linearGradient>

    <!-- Radial Ambient Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Waveform Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Terminal Window Gradients -->
    <linearGradient id="termBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .trace-line { stroke: #0284c7; stroke-opacity: 0.35; stroke-width: 1.5; fill: none; }
    .trace-active { stroke: #00f2fe; stroke-opacity: 0.7; stroke-width: 1.8; fill: none; }
    .via { fill: #00f2fe; fill-opacity: 0.8; stroke: #0c4a6e; stroke-width: 2; }
    .dim-via { fill: #0369a1; fill-opacity: 0.4; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#glowLeft)"/>
  <rect width="1200" height="420" fill="url(#glowRight)"/>

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Circuit Board Traces (Geometric Modern Aesthetics) -->
  <g>
    <!-- Trace cluster left -->
    <path d="M 40 370 L 120 370 L 160 330 L 260 330" class="trace-line"/>
    <path d="M 40 390 L 140 390 L 190 340 L 320 340 L 350 370 L 420 370" class="trace-active" filter="url(#neonGlow)"/>
    <path d="M 90 420 L 90 380 L 150 320 L 150 250" class="trace-line"/>
    <circle cx="260" cy="330" r="3.5" class="via"/>
    <circle cx="420" cy="370" r="4" class="via"/>
    <circle cx="150" cy="250" r="3" class="dim-via"/>
    <circle cx="120" cy="370" r="2.5" class="dim-via"/>

    <!-- Microchip Outline left-bottom -->
    <rect x="45" y="320" width="38" height="38" rx="4" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" opacity="0.8"/>
    <!-- Chip pins -->
    <line x1="53" y1="316" x2="53" y2="320" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="64" y1="316" x2="64" y2="320" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="75" y1="316" x2="75" y2="320" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="53" y1="358" x2="53" y2="362" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="64" y1="358" x2="64" y2="362" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="75" y1="358" x2="75" y2="362" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="64" cy="339" r="6" fill="#00f2fe" opacity="0.4" filter="url(#neonGlow)"/>

    <!-- Top decorative trace -->
    <path d="M 50 40 L 220 40 L 260 80 L 440 80" class="trace-line"/>
    <circle cx="440" cy="80" r="3" class="dim-via"/>
    <circle cx="50" cy="40" r="3" class="via"/>

    <!-- Middle bridge traces leading to terminal -->
    <path d="M 520 180 L 590 180 L 630 140 L 680 140" class="trace-active" stroke-dasharray="6,4"/>
    <path d="M 480 280 L 560 280 L 620 340 L 680 340" class="trace-line"/>
    <circle cx="680" cy="140" r="3.5" class="via"/>
    <circle cx="680" cy="340" r="3.5" class="via"/>
  </g>

  <!-- ================= LEFT COLUMN: HERO INFORMATION ================= -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="370" height="28" rx="14" fill="#0f284e" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="5" fill="#00f2fe" filter="url(#neonGlow)"/>
      <text x="32" y="18.5" class="font-mono" font-size="11.5" font-weight="600" fill="#38bdf8" letter-spacing="1">FOSSEE IIT BOMBAY · INTERNSHIP 2026</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 125)">
      <!-- Lightning icon -->
      <path d="M -8 -8 L -1 6 L 5 6 L -3 18 L 12 3 L 5 3 L 10 -8 Z" fill="#38bdf8" transform="translate(0, -6) scale(1.3)" filter="url(#neonGlow)"/>
      <text x="28" y="0" class="font-sans" font-size="37" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">eSim Tool Manager</text>
      <text x="28" y="38" class="font-sans" font-size="20" font-weight="500" fill="#94a3b8">A Smarter Way to Install, Manage &amp; Verify eSim Tools</text>
    </g>

    <!-- Description Paragraph -->
    <text x="0" y="206" class="font-sans" font-size="14.5" fill="#cbd5e1" line-height="1.6">
      <tspan x="0" dy="0">A unified cross-platform Python CLI engineered for automated dependency</tspan>
      <tspan x="0" dy="24">discovery, safe environment injection, verified portable Ngspice simulation,</tspan>
      <tspan x="0" dy="24">and strict cryptographic package receipt validation.</tspan>
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 290)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="125" height="32" rx="6" fill="#0b1e3b" stroke="#1e3a8a" stroke-width="1"/>
        <text x="14" y="20" class="font-mono" font-size="11.5" font-weight="600" fill="#38bdf8">🔍 Discovery</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(135, 0)">
        <rect x="0" y="0" width="125" height="32" rx="6" fill="#0b1e3b" stroke="#1e3a8a" stroke-width="1"/>
        <text x="14" y="20" class="font-mono" font-size="11.5" font-weight="600" fill="#38bdf8">📦 WinGet/APT</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(270, 0)">
        <rect x="0" y="0" width="135" height="32" rx="6" fill="#0b1e3b" stroke="#1e3a8a" stroke-width="1"/>
        <text x="14" y="20" class="font-mono" font-size="11.5" font-weight="600" fill="#38bdf8">🛡️ Ngspice 47</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(415, 0)">
        <rect x="0" y="0" width="130" height="32" rx="6" fill="#0b1e3b" stroke="#1e3a8a" stroke-width="1"/>
        <text x="14" y="20" class="font-mono" font-size="11.5" font-weight="600" fill="#38bdf8">⚙️ 101 Tests</text>
      </g>
    </g>

    <!-- Engineering Sub-info -->
    <text x="0" y="362" class="font-mono" font-size="12" fill="#64748b">
      Target Architecture: x86_64 · Windows 11 &amp; Ubuntu 24/26 · Python 3.11+
    </text>
  </g>

  <!-- ================= RIGHT COLUMN: TERMINAL & OSCILLOSCOPE ================= -->
  <g transform="translate(680, 42)">
    <!-- Terminal Window Container -->
    <g>
      <!-- Window Shadow / Border glow -->
      <rect x="-1" y="-1" width="472" height="216" rx="11" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.4" filter="url(#neonGlow)"/>
      <rect x="0" y="0" width="470" height="214" rx="10" fill="#090f1d" stroke="#1e293b" stroke-width="1"/>

      <!-- Window Title Bar -->
      <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 460 0 C 465.5 0 470 4.5 470 10 L 470 34 L 0 34 Z" fill="url(#termBarGrad)"/>
      <line x1="0" y1="34" x2="470" y2="34" stroke="#1e293b" stroke-width="1"/>

      <!-- Window Control Dots -->
      <circle cx="20" cy="17" r="5.5" fill="#ef4444"/>
      <circle cx="37" cy="17" r="5.5" fill="#eab308"/>
      <circle cx="54" cy="17" r="5.5" fill="#22c55e"/>

      <!-- Terminal Title -->
      <text x="235" y="21" class="font-mono" font-size="11.5" fill="#94a3b8" text-anchor="middle">powershell — esim-tool-manager validate</text>

      <!-- Terminal Body Content -->
      <g transform="translate(20, 58)" class="font-mono" font-size="12">
        <!-- Command Prompt Line -->
        <text x="0" y="0" fill="#38bdf8" font-weight="700">PS D:\eSim-Tool-Manager&gt;</text>
        <text x="180" y="0" fill="#f1f5f9">python -m esim_tool_manager validate</text>

        <!-- Log items -->
        <text x="0" y="24" fill="#22c55e" font-weight="700">[✓]</text>
        <text x="24" y="24" fill="#94a3b8">eSim Root:</text>
        <text x="105" y="24" fill="#e2e8f0">D:\VS Code\FOSSEE\eSim (detected)</text>

        <text x="0" y="46" fill="#22c55e" font-weight="700">[✓]</text>
        <text x="24" y="46" fill="#94a3b8">Ngspice 47:</text>
        <text x="110" y="46" fill="#e2e8f0">verified receipt &amp; SHA-256 match</text>

        <text x="0" y="68" fill="#22c55e" font-weight="700">[✓]</text>
        <text x="24" y="68" fill="#94a3b8">Simulation:</text>
        <text x="115" y="68" fill="#38bdf8">v(out) = 1.000V (expected 1.000V)</text>

        <text x="0" y="90" fill="#22c55e" font-weight="700">[✓]</text>
        <text x="24" y="90" fill="#94a3b8">Environment:</text>
        <text x="125" y="90" fill="#e2e8f0">Process-scoped (system unchanged)</text>

        <!-- Status Highlight Banner inside Terminal -->
        <g transform="translate(0, 108)">
          <rect x="0" y="0" width="430" height="26" rx="5" fill="#052e16" stroke="#15803d" stroke-width="1"/>
          <circle cx="16" cy="13" r="4.5" fill="#22c55e" filter="url(#neonGlow)"/>
          <text x="30" y="17" class="font-mono" font-size="11" font-weight="700" fill="#4ade80">OVERALL: PASS (Analog Runtime Verified)</text>
        </g>
      </g>
    </g>

    <!-- Oscilloscope / Waveform Card Container -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="470" height="98" rx="8" fill="#061224" stroke="#1e3a8a" stroke-width="1"/>

      <!-- Oscilloscope grid inside card -->
      <g stroke="#0e3a6c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6">
        <line x1="20" y1="20" x2="450" y2="20"/>
        <line x1="20" y1="50" x2="450" y2="50"/>
        <line x1="20" y1="80" x2="450" y2="80"/>
        <line x1="90" y1="10" x2="90" y2="90"/>
        <line x1="170" y1="10" x2="170" y2="90"/>
        <line x1="250" y1="10" x2="250" y2="90"/>
        <line x1="330" y1="10" x2="330" y2="90"/>
        <line x1="410" y1="10" x2="410" y2="90"/>
      </g>

      <!-- Scope Header -->
      <text x="20" y="24" class="font-mono" font-size="10.5" fill="#38bdf8" font-weight="600">NGSPICE TRANSIENT / OP RUNTIME VERIFIER</text>
      <text x="450" y="24" class="font-mono" font-size="10.5" fill="#22c55e" text-anchor="end">DC OP: 1.000 V</text>

      <!-- Waveform Simulation Curve: Step Response / Damped Oscillation to 1.0V -->
      <path d="M 30 75 L 70 75 Q 85 75 90 28 Q 98 12 110 32 T 140 54 T 170 48 T 200 50 L 450 50"
            fill="none" stroke="url(#waveGrad)" stroke-width="2.5" filter="url(#neonGlow)"/>

      <!-- Measurement Marker at equilibrium line -->
      <circle cx="200" cy="50" r="4" fill="#00f2fe" filter="url(#neonGlow)"/>
      <circle cx="450" cy="50" r="3" fill="#22c55e"/>
      <line x1="200" y1="50" x2="200" y2="78" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="208" y="76" class="font-mono" font-size="9.5" fill="#94a3b8">t_settle = 0.22s · 0 errors</text>
    </g>
  </g>
</svg>